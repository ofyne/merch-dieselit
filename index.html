		/>

			name="theme-color"

			media="(prefers-color-scheme: dark)"

			name="description"
			content="Official DIESELit merch. Limited drops of hoodies, tees, caps and stickers for the DIESEL crypto family. Order via Telegram."

			name="keywords"
			content="DIESELit, DIESEL merch, TON blockchain merch, crypto merch, hoodies, tees, caps, stickers, DIESEL COIN, crypto family"
		/>

		<meta property="og:title" content="DIESELit — Official Merch Store" />

			property="og:description"
			content="Limited merch drops for the DIESEL crypto family. Order via Telegram."

		<meta property="og:image" content="/og-image.jpg" />

			name="twitter:description"
			content="Limited merch drops for the DIESEL crypto family."

		<link rel="preconnect" href="https://t.me" />

		<!-- Splash: только на время загрузки, чёрный фон -->
		<style>
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;

				display: flex;
				align-items: center;
				justify-content: center;

				background: #17171a;
				transition: opacity 400ms ease;
			}

			#splash.hide {
				opacity: 0;
				pointer-events: none;
			}

			#splash-logo {
				width: 64px;
				height: 64px;
				animation: splash-pulse 1.6s ease-in-out infinite;
			}

			@keyframes splash-pulse {
				0%,
				100% {
					transform: scale(1);
					opacity: 0.85;
				}
				50% {
					transform: scale(1.08);
					opacity: 1;
				}
			}
		</style>

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "DIESELit",
				"url": "https://dieselit-merch.vip",
				"logo": "https://dieselit-merch.vip/icon.png",
				"sameAs": [
					"https://t.me/+IpLNl8Ih0URhYjNk",
					"https://x.com/DIESEL_COIN25",
					"https://www.instagram.com/diesel_coin25"
				],
				"contactPoint": {
					"@type": "ContactPoint",
					"contactType": "customer support",
					"url": "https://t.me/VersoX23"
				}
			}
		</script>

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "DIESELit",
				"url": "https://dieselit-merch.vip"
			}
		</script>
	</head>
	<body>
		<div id="splash">
			<img id="splash-logo" src="/icon.png" alt="DIESELit" />
		</div>

		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
