<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Favicon & Manifest -->
		<link rel="icon" type="image/png" href="/icon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Theme color per scheme -->
		<meta
			name="theme-color"
			content="#f4f4f5"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#17171a"
			media="(prefers-color-scheme: dark)"
		/>

		<!-- Primary -->
		<title>DIESELit — Official Merch Store</title>
		<meta
			name="description"
			content="Official DIESELit merch. Limited drops of hoodies, tees, caps and stickers for the DIESEL crypto family. Order via Telegram."
		/>
		<meta
			name="keywords"
			content="DIESELit, DIESEL merch, TON blockchain merch, crypto merch, hoodies, tees, caps, stickers, DIESEL COIN, crypto family"
		/>
		<meta name="author" content="DIESELit" />
		<meta name="robots" content="index, follow, max-image-preview:large" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="canonical" href="https://dieselit-merch.vip/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="DIESELit" />
		<meta property="og:title" content="DIESELit — Official Merch Store" />
		<meta
			property="og:description"
			content="Limited merch drops for the DIESEL crypto family. Order via Telegram."
		/>
		<meta property="og:image" content="/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="DIESELit merch" />
		<meta property="og:url" content="https://dieselit-merch.vip/" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@DIESEL_COIN25" />
		<meta name="twitter:creator" content="@DIESEL_COIN25" />
		<meta name="twitter:title" content="DIESELit — Official Merch Store" />
		<meta
			name="twitter:description"
			content="Limited merch drops for the DIESEL crypto family."
		/>
		<meta name="twitter:image" content="/og-image.jpg" />

		<!-- Preconnect -->
		<link rel="preconnect" href="https://t.me" />

		<!-- JSON-LD: Organization -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "DIESELit",
				"url": "https://dieselit-merch.vip",
				"logo": "https://dieselit-merch.vip/favicon.svg",
				"sameAs": [
					"https://t.me/+IpLNl8Ih0URhYjNk",
					"https://x.com/DIESEL_COIN25",
					"https://www.instagram.com/diesel_coin25"
				],
				"contactPoint": {
					"@type": "ContactPoint",
					"contactType": "customer support",
					"url": "https://t.me/VersoX23"
				}
			}
		</script>

		<!-- JSON-LD: WebSite with SearchAction -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "DIESELit",
				"url": "https://dieselit-merch.vip"
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
